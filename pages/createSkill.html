<div class="container mb-5 pt-5">
    <h1 class="text-center mb-5">Ajouter une compétence</h1>

    <div class="row">
        
        <form class="col-12 col-md-6 mx-auto form-account border">
                
            <div class="col-md-6 mb-3">
                <label for="NameInput" class="form-label">Nom</label>
                <input type="text" class="form-control" id="NameInput" placeholder="Nom de la compétence" required>
            </div>

            <div class="mb-3">
                <label for="LogoInput" class="form-label">Logo</label>
                <input type="text" class="form-control" id="LogoInput" placeholder="competence.png" required>
            </div>

            <div class="text-center">
                <button type="button" class="btn btn-primary" id="create-project-btn">Envoyer</button>
            </div>

        </form>
    </div>
</div>
