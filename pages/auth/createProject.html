<div class="container mb-5 pt-5">
    <h1 class="text-center mb-5">Ajouter un projet</h1>

    <div class="row">
        
        <form class="col-12 col-md-6 mx-auto form-account border">
                
            <div class="col-md-6 mb-3">
                <label for="TitleInput" class="form-label">Titre</label>
                <input type="text" class="form-control" id="TitleInput" placeholder="Titre du projet" required>
            </div>

            <div class="mb-3">
                <label for="DescriptionInput" class="form-label">Description</label>
                <textarea rows="5" cols="33" class="form-control" id="DescriptiondInput" required>Description du projet</textarea>
            </div>

            <div class="mb-3">
                <label for="ImageInput" class="form-label">Image</label>
                <input type="text" class="form-control" id="ImageInput" placeholder="/assets/images/project/projet.png" required>
            </div>

            <div class="mb-3">
                <label for="GithubInput" class="form-label">Github</label>
                <input type="text" class="form-control" id="GithubInput" placeholder="Http://github.com" required>
            </div>

            <div class="mb-5">
                <label for="LiveInput" class="form-label">Live</label>
                <input type="text" class="form-control" id="LiveInput" placeholder="Http://monsite.com" required>
            </div>

            <div class="text-center">
                <button type="button" class="btn btn-primary" id="create-project-btn">Envoyer</button>
            </div>

        </form>
    </div>
</div>
