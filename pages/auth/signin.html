<div class="container mb-5 pt-5">
    <h1 class="text-center mb-5">Connexion</h1>

    <form class="col-12 col-md-4 mx-auto mb-5 form-signin">
        <div class="mb-3">
            <label for="EmailInput" class="form-label">Email</label>
            <input type="email" class="form-control" id="EmailInput" placeholder="test@mail.fr">
        </div>

        <div>
            <label for="PasswordInput" class="form-label">Mot de passe</label>
            <input type="password" class="form-control" id="PasswordInput">

            <div class="invalid-feedback">
                Le mail et le mot de passe ne correspondent pas.
            </div>
        </div>
    </form>

    <div class="text-center">
        <button type="submit" class="btn btn-primary" id="btnSignin">Connexion</button>
    </div>
</div>
