<section class="container mb-5 pt-5">
    <div class="row align-items-center  text-center">
        <div class="col-md-7">
            <h1>Développeur Web</h1>
            <p>Envoyer-moi votre idée de projet, et je vous la réalise.</p>
        </div>

        <div class="col-md-5 my-4 photo text-center">
            <img src="/assets/images/photo.png" alt="Didic" class="img-fluid">
        </div>
    </div>
</section>

<section class="container mb-5 pt-5" id="projects">
    <h2 class="text-center mb-5">Mes projets</h2>

    <div class="row g-4 justify-content-center" id="all-projects">
        <template id="project-template">
            <div class="col-12 col-md-6 col-lg-4 project">
            
                <div class="card h-100">
                    <div class="action-image-buttons d-flex justify-content-between mx-2 my-2" data-show="admin">
                        <button type="button" class="btn btn-outline-primary project-edit"><i class="bi bi-pencil"></i></button>
                        <button type="button" class="btn btn-outline-primary project-delete"><i class="bi bi-trash"></i></button>
                    </div>

                    <img class="card-img-top project-image" alt="Aperçu du projet">

                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title project-title">l</h5>
                        <p class="card-text project-description"></p>
                    </div>

                    <div class="d-flex gap-2 flex-wrap justify-content-center py-5 project-skills">
                        <!-- Emplacement des compétences -->
                    </div>
    
                    <div class="d-flex justify-content-between mx-4 mb-4">
                        <a class="btn btn-primary project-github">Github</a>
                        <a class="btn btn-primary project-live">Url</a>
                    </div>
                </div>
            </div>   
        </template>
    </div>

</section>

<section class="container mb-5 pt-5">
    <h2 class="text-center mb-5">Mes compétences</h2>
    
    <div class="row g-4 justify-content-center" id="skills-img">
        <template id="skill-template">
            <div class="skill justify-content-center mx-2">
                <img class="img skill-img" width="36">
            </div>
        </template>
    </div>
</section>
