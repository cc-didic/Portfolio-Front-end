<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Mon CSS -->
     <link rel="stylesheet" href="scss/main.css">

    <title>Portfolio</title>
</head>
<body>

    <header class="site-header">
        <!-- navbar : composant de navigation Bootstrap -->
        <!-- navbar-expand-lg : menu horizontal à partir de lg (desktop), burger en mobile -->
        <!-- bg-light : fond clair (couleur Bootstrap) -->
        <nav class="navbar navbar-expand-lg bg-light">

            <!-- container-fluid : largeur 100% avec padding horizontal -->
            <div class="container-fluid">

                <!-- navbar-brand : zone logo / nom du site -->
                 <a class="navbar-brand " href="/">Caron cédric</a>

                 <!-- navbar-toggler : bouton burger (mobile) -->
                <button 
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav"
                    aria-controls="navbarNav"
                    aria-expanded="false"
                    aria-label="Toggle navigation">

                    <!-- navbar-toggler-icon : icône burger -->
                     <span class="navbar-toggler-icon"></span>
                </button>

                <!-- collapse : élément masqué/affiché -->
                <!-- navbar-collapse : style spécifique navbar -->
                <div class="collapse navbar-collapse" id="navbarNav">

                     <!-- navbar-nav : conteneur des liens -->
                    <!-- mx-auto : pour centrer -->
                    <ul class="navbar-nav mx-auto">

                        <!-- nav-item : élément de menu -->
                        <li class="nav-item">

                            <!-- nav-link : style de lien navbar -->
                            <!-- active : lien actif -->
                            <!-- aria-current : accessibilité (page courante) -->
                            <a class="nav-link" aria-current="page" href="/">Accueil</a>
                        </li>
                        <li class="nav-item"><a class="nav-link" href="#">Créer un projet</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">Mes projets</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">Mes compétences</a></li>
                    </ul>

                    <div>
                        <a href="#" class="btn btn-primary" aria-label="Se connecter">
                            Se connecter
                        </a>
                    </div>

                </div>
                
            </div>
        </nav>
    </header>

    <main id="main-page">
        <!-- Le contenu de la page sera injectée ici -->
    </main>

    <footer class="site-footer">Le footer de mon site</footer>

    <!-- Inclure le système de routage -->
    <script type="module" src="Router/router.js"></script>

    <!-- Ajout du script Bootstrap -->
    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    
</body>
</html>
